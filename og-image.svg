<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#050508"/>
      <stop offset="100%" style="stop-color:#0a0a12"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c5cff"/>
      <stop offset="50%" style="stop-color:#b886ff"/>
      <stop offset="100%" style="stop-color:#00d4aa"/>
    </linearGradient>
    <radialGradient id="glow1" cx="30%" cy="30%">
      <stop offset="0%" style="stop-color:#7c5cff;stop-opacity:0.15"/>
      <stop offset="100%" style="stop-color:#7c5cff;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="70%" cy="70%">
      <stop offset="0%" style="stop-color:#00d4aa;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:#00d4aa;stop-opacity:0"/>
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Glows -->
  <ellipse cx="360" cy="190" rx="400" ry="300" fill="url(#glow1)"/>
  <ellipse cx="840" cy="440" rx="350" ry="250" fill="url(#glow2)"/>
  
  <!-- Grid lines -->
  <g opacity="0.03" stroke="#7c5cff" stroke-width="1">
    <line x1="0" y1="0" x2="0" y2="630"/>
    <line x1="80" y1="0" x2="80" y2="630"/>
    <line x1="160" y1="0" x2="160" y2="630"/>
    <line x1="240" y1="0" x2="240" y2="630"/>
    <line x1="320" y1="0" x2="320" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="480" y1="0" x2="480" y2="630"/>
    <line x1="560" y1="0" x2="560" y2="630"/>
    <line x1="640" y1="0" x2="640" y2="630"/>
    <line x1="720" y1="0" x2="720" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="880" y1="0" x2="880" y2="630"/>
    <line x1="960" y1="0" x2="960" y2="630"/>
    <line x1="1040" y1="0" x2="1040" y2="630"/>
    <line x1="1120" y1="0" x2="1120" y2="630"/>
    <line x1="1200" y1="0" x2="1200" y2="630"/>
    <line x1="0" y1="0" x2="1200" y2="0"/>
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="560" x2="1200" y2="560"/>
    <line x1="0" y1="630" x2="1200" y2="630"/>
  </g>
  
  <!-- Name -->
  <text x="120" y="260" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="800" fill="#f0f0f5" letter-spacing="-2">Javier Garrido</text>
  <text x="120" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="800" fill="url(#accent)" letter-spacing="-2">Terrón</text>
  
  <!-- Role -->
  <text x="120" y="390" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#a0a0b8" letter-spacing="0.5">Full Stack Developer</text>
  
  <!-- Tagline -->
  <text x="120" y="440" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#686880">Construyendo software que importa.</text>
  
  <!-- Accent line -->
  <rect x="120" y="360" width="120" height="3" rx="1.5" fill="url(#accent)"/>
  
  <!-- Corner accent -->
  <circle cx="1100" cy="100" r="4" fill="#7c5cff" opacity="0.6"/>
  <circle cx="1080" cy="120" r="2" fill="#00d4aa" opacity="0.4"/>
</svg>
